name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --all-targets
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: cargo run --quiet --example basic

  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package

  # The real correctness gate: run random inputs through this crate and through
  # the JavaScript package it ports, and require byte-identical output.
  differential:
    name: differential / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: cargo build --release --example oracle
      - run: npm ci
        working-directory: scripts

      # Seeded on the run number so successive runs explore different inputs
      # while any single failure stays reproducible from the seed it prints.
      - name: parse
        working-directory: scripts
        run: node fuzz.mjs 60000 ${{ github.run_number }}

      - name: config
        working-directory: scripts
        run: node fuzz-config.mjs 5000 ${{ github.run_number }}

  # Guards against hand-edited expectations: regenerating from the reference
  # implementation must be a no-op.
  vectors-up-to-date:
    name: recorded vectors match the reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
        working-directory: scripts
      - run: npm run gen
        working-directory: scripts
      - name: fail if regeneration changed anything
        run: git diff --exit-code -- tests/support/vectors_generated.rs
