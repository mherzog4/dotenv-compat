[package]
name = "dotenv-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A faithful Rust port of the JavaScript dotenv parser: loads environment variables from .env files"
license = "MIT"
readme = "readme.md"
keywords = ["dotenv", "env", "environment", "config"]
categories = ["config"]
exclude = ["scripts/node_modules", "scripts/fuzz-failures.json", "port.md"]

[lib]
name = "dotenv_rs"
path = "src/lib.rs"

[dependencies]
